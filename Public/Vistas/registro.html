<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | VITAL+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Panel izquierdo */
        .panel-izquierdo {
            flex: 1;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #48cae4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .panel-izquierdo::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .panel-izquierdo::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            bottom: -80px;
            right: -80px;
        }

        .logo-section {
            text-align: center;
            z-index: 1;
        }

        .logo-section img {
            width: 150px;
            height: 150px;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .logo-section h1 {
            font-size: 4em;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .logo-section p {
            font-size: 1.3em;
            color: #e0f7fa;
            font-weight: 300;
            max-width: 400px;
            line-height: 1.6;
        }

        .decoracion {
            margin-top: 40px;
            display: flex;
            gap: 15px;
        }

        .circulo {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        .circulo:nth-child(2) {
            animation-delay: 0.3s;
        }

        .circulo:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* Panel derecho - Formulario */
        .panel-derecho {
            flex: 1.5;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .panel-derecho::-webkit-scrollbar {
            width: 10px;
        }

        .panel-derecho::-webkit-scrollbar-track {
            background: #e0e0e0;
        }

        .panel-derecho::-webkit-scrollbar-thumb {
            background: #00b4d8;
            border-radius: 5px;
        }

        .panel-derecho::-webkit-scrollbar-thumb:hover {
            background: #0077b6;
        }

        .registro-container {
            background: #ffffff;
            padding: 40px 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 119, 182, 0.12);
            width: 100%;
            max-width: 650px;
            border-left: 5px solid #00b4d8;
            margin: 20px 0;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #0077b6;
            font-weight: 700;
            font-size: 2em;
        }

        .subtitulo {
            text-align: center;
            color: #52796f;
            margin-bottom: 35px;
            font-size: 0.95em;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            color: #2d6a4f;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input, select {
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus, select:focus {
            border-color: #00b4d8;
            outline: none;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.1);
        }

        select {
            cursor: pointer;
        }

        button {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .volver {
            margin-top: 25px;
            text-align: center;
        }

        .volver a {
            text-decoration: none;
            color: #0077b6;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .volver a:hover {
            color: #023e8a;
            gap: 8px;
        }

        /* Responsive */
        @media (max-width: 968px) {
            body {
                flex-direction: column;
            }

            .panel-izquierdo {
                min-height: 40vh;
                padding: 30px;
            }

            .logo-section h1 {
                font-size: 2.5em;
            }

            .logo-section img {
                width: 100px;
                height: 100px;
            }

            .panel-derecho {
                padding: 30px 20px;
            }

            .registro-container {
                padding: 35px 30px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: 1;
            }

            button {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>

<!-- Panel Izquierdo -->
<div class="panel-izquierdo">
    <div class="logo-section">
        <img src="/images/logoblanco.png" alt="Logo VITAL+" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3774/3774299.png'">
        <h1>VITAL+</h1>
        <p>Sistema integral de gestión hospitalaria para el cuidado de tu salud</p>
        <div class="decoracion">
            <div class="circulo"></div>
            <div class="circulo"></div>
            <div class="circulo"></div>
        </div>
    </div>
</div>

<!-- Panel Derecho - Formulario -->
<div class="panel-derecho">
    <div class="registro-container">
        <h2>Registro</h2>
        <p class="subtitulo">Crea tu cuenta en VITAL+</p>

        <form id="formRegistro">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="identificacion">Identificación</label>
                <input type="text" id="identificacion" name="identificacion" placeholder="Número de documento" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="(+57) 300 123 4567" required>
            </div>

            <div class="form-group full-width">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Dirección de residencia" required>
            </div>

            <div class="form-group full-width">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="rol">Rol</label>
                <select id="rol" name="rol" required>
                    <option value="">Selecciona un rol</option>
                    <option value="paciente">Paciente</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres" required>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div class="volver">
            <a href="index.html">← Volver al inicio</a>
        </div>
    </div>
</div>

<!-- Librería SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/registro.js"></script>

</body>
</html>
