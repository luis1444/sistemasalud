<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | VITAL+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f7fa, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo img {
            width: 60px;
            height: 60px;
        }

        .logo h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .registro-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 119, 182, 0.15);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0077b6;
            font-weight: 700;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 5px;
        }

        input, select {
            padding: 12px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1em;
            transition: border 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #00b4d8;
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
        }

        .volver {
            margin-top: 15px;
            text-align: center;
        }

        .volver a {
            text-decoration: none;
            color: #0077b6;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .volver a:hover {
            color: #023e8a;
        }
    </style>
</head>
<body>

<div class="logo">
    <img src="images/logo.png" alt="Logo VITAL+" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3774/3774299.png'">
    <h1>VITAL+</h1>
</div>

<div class="registro-container">
    <h2>Registro de Usuario</h2>
    <form id="formRegistro" method="POST" action="/api/usuarios/registro">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="identificacion">Identificación</label>
        <input type="text" id="identificacion" name="identificacion" required>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required>

        <label for="rol">Rol</label>
        <select id="rol" name="rol" required>
            <option value="">Selecciona un rol</option>
            <option value="paciente">Paciente</option>
            <option value="administrador">Administrador</option>
        </select>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required>

        <button type="submit">Registrarse</button>
    </form>
    <script src="registro.js"></script>

    <div class="volver">
        <a href="index.html">← Volver al inicio</a>
    </div>
</div>

</body>
</html>
