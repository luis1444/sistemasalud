<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal | VITAL+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #e0f7fa, #ffffff); min-height: 100vh; }
        .header { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,119,182,0.3); }
        .logo-header { display: flex; align-items: center; gap: 15px; }
        .logo-header h1 { font-size: 1.8em; }
        .btn-volver { background: rgba(255,255,255,0.2); color: white; border: 2px solid white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn-volver:hover { background: white; color: #0077b6; }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 40px; }
        .page-title { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,119,182,0.1); margin-bottom: 30px; }
        .page-title h2 { color: #0077b6; font-size: 2em; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,119,182,0.1); flex-wrap: wrap; }
        .tab { padding: 12px 30px; background: #f8f9fa; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; color: #52796f; }
        .tab.active { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        .form-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,119,182,0.1); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { color: #0077b6; font-weight: 600; }
        .form-group input, .form-group select { padding: 12px; border: 2px solid #e0f7fa; border-radius: 8px; font-size: 1em; transition: all 0.3s ease; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0077b6; }
        .btn-submit { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; border: none; padding: 15px 40px; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,119,182,0.3); }
        .lista-personal { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,119,182,0.1); }
        .filtros { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filtros select, .filtros input { padding: 10px; border: 2px solid #e0f7fa; border-radius: 8px; flex: 1; min-width: 200px; }
        .tabla-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; }
        th, td { padding: 15px; text-align: left; }
        tbody tr { border-bottom: 1px solid #e0f7fa; transition: all 0.3s ease; }
        tbody tr:hover { background: #f8f9fa; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge-activo { background: #d4edda; color: #155724; }
        .badge-inactivo { background: #f8d7da; color: #721c24; }
        .badge-doctor { background: #cce5ff; color: #004085; }
        .badge-laboratorio { background: #fff3cd; color: #856404; }
        .badge-farmacia { background: #d1ecf1; color: #0c5460; }
        .btn-action { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; transition: all 0.3s ease; margin: 0 5px; }
        .btn-editar { background: #ffc107; color: #000; }
        .btn-desactivar { background: #dc3545; color: white; }
        .btn-activar { background: #28a745; color: white; }
        .stats-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-mini { background: linear-gradient(135deg, #0077b6, #00b4d8); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-mini-number { font-size: 2em; font-weight: 700; }
        .stat-mini-label { font-size: 0.9em; opacity: 0.9; }
        @media (max-width: 768px) { .container { padding: 0 20px; } .form-grid { grid-template-columns: 1fr; } .tabs { flex-direction: column; } .filtros { flex-direction: column; } }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-header"><h1>Gestión de Personal</h1></div>
    <button class="btn-volver" onclick="volverDashboard()">← Volver al Dashboard</button>
</div>

<div class="container">
    <div class="page-title">
        <h2>Administración de Personal Médico</h2>
        <p>Registra y gestiona médicos, laboratoristas y personal de farmacia</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="cambiarTab('registrar')">➕ Registrar Personal</button>
        <button class="tab" onclick="cambiarTab('listar')">📋 Listar Personal</button>
        <button class="tab" onclick="cambiarTab('estadisticas')">📊 Estadísticas</button>
    </div>

    <!-- SECCIÓN REGISTRAR -->
    <div id="section-registrar" class="content-section active">
        <div class="form-card">
            <h3 style="color: #0077b6; margin-bottom: 20px;">Registrar Nuevo Personal</h3>
            <form id="formRegistrarPersonal">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tipo de Personal *</label>
                        <select id="rolPersonal" required>
                            <option value="">Seleccione...</option>
                            <option value="doctor">Médico</option>
                            <option value="laboratorio">Laboratorista</option>
                            <option value="farmacia">Farmacéutico</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <input type="text" id="nombrePersonal" required>
                    </div>

                    <div class="form-group">
                        <label>Identificación *</label>
                        <input type="text" id="identificacionPersonal" required>
                    </div>

                    <div class="form-group">
                        <label>Correo Electrónico *</label>
                        <input type="email" id="correoPersonal" required>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="telefonoPersonal">
                    </div>

                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="direccionPersonal">
                    </div>

                    <div class="form-group" id="especialidadGroup" style="display: none;">
                        <label>Especialidad Médica *</label>
                        <select id="especialidadPersonal">
                            <option value="">Seleccione una especialidad...</option>
                            <option value="Medicina General">Medicina General</option>
                            <option value="Cardiología">Cardiología</option>
                            <option value="Dermatología">Dermatología</option>
                            <option value="Pediatría">Pediatría</option>
                            <option value="Ginecología">Ginecología</option>
                            <option value="Traumatología">Traumatología</option>
                            <option value="Neurología">Neurología</option>
                            <option value="Oftalmología">Oftalmología</option>
                            <option value="Otorrinolaringología">Otorrinolaringología</option>
                            <option value="Psiquiatría">Psiquiatría</option>
                            <option value="Urología">Urología</option>
                            <option value="Gastroenterología">Gastroenterología</option>
                            <option value="Endocrinología">Endocrinología</option>
                            <option value="Neumología">Neumología</option>
                            <option value="Oncología">Oncología</option>
                            <option value="Cirugía General">Cirugía General</option>
                            <option value="Anestesiología">Anestesiología</option>
                            <option value="Radiología">Radiología</option>
                            <option value="Medicina Interna">Medicina Interna</option>
                            <option value="Infectología">Infectología</option>
                        </select>
                    </div>

                    <div class="form-group" id="areaGroup" style="display: none;">
                        <label>Área de Trabajo *</label>
                        <select id="areaPersonal">
                            <option value="">Seleccione un área...</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">✅ Registrar Personal</button>
            </form>
        </div>
    </div>

    <!-- SECCIÓN LISTAR Y ESTADÍSTICAS -->
    <!-- (Se mantiene igual, sin cambios) -->
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    let personalData = [];
    const areasLaboratorio = ['Hematología','Microbiología','Inmunología','Urianálisis','Toma de Muestras','Histopatología','Citología'];
    const areasFarmacia = ['Farmacia Hospitalaria','Dispensación','Control de Inventarios','Información de Medicamentos'];

    window.addEventListener('DOMContentLoaded', () => { verificarAutenticacion(); configurarFormulario(); });

    function verificarAutenticacion() {
        const token = localStorage.getItem('token');
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        if (!token || usuario.rol !== 'admin') {
            Swal.fire({ icon: 'error', title: 'Acceso denegado', text: 'No tienes permisos para acceder a esta página' })
                .then(() => { window.location.href = '/login.html'; });
        }
    }

    function generarContrasena() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
        let pass = '';
        for (let i = 0; i < 10; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        return pass;
    }

    function configurarFormulario() {
        const rolSelect = document.getElementById('rolPersonal');
        const especialidadGroup = document.getElementById('especialidadGroup');
        const areaGroup = document.getElementById('areaGroup');
        const areaSelect = document.getElementById('areaPersonal');

        rolSelect.addEventListener('change', function() {
            especialidadGroup.style.display = 'none';
            areaGroup.style.display = 'none';
            document.getElementById('especialidadPersonal').required = false;
            document.getElementById('areaPersonal').required = false;

            if (this.value === 'doctor') {
                especialidadGroup.style.display = 'block';
                document.getElementById('especialidadPersonal').required = true;
            } else if (this.value === 'laboratorio' || this.value === 'farmacia') {
                areaGroup.style.display = 'block';
                document.getElementById('areaPersonal').required = true;
                areaSelect.innerHTML = '<option value="">Seleccione un área...</option>';
                (this.value === 'laboratorio' ? areasLaboratorio : areasFarmacia).forEach(area => {
                    const option = document.createElement('option');
                    option.value = area;
                    option.textContent = area;
                    areaSelect.appendChild(option);
                });
            }
        });

        document.getElementById('formRegistrarPersonal').addEventListener('submit', registrarPersonal);
    }

    async function registrarPersonal(e) {
        e.preventDefault();
        const rol = document.getElementById('rolPersonal').value;
        const nombre = document.getElementById('nombrePersonal').value.trim();
        const identificacion = document.getElementById('identificacionPersonal').value.trim();
        const correo = document.getElementById('correoPersonal').value.trim();
        const telefono = document.getElementById('telefonoPersonal').value.trim();
        const direccion = document.getElementById('direccionPersonal').value.trim();
        const contrasena = generarContrasena();

        const datos = { rol, nombre, identificacion, correo, telefono, direccion, contrasena };
        if (rol === 'doctor') datos.especialidad = document.getElementById('especialidadPersonal').value;
        else if (rol === 'laboratorio' || rol === 'farmacia') datos.area = document.getElementById('areaPersonal').value;

        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/usuarios/crear-personal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(datos)
            });

            const resultado = await response.json();
            if (resultado.exito) {
                await Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: resultado.mensaje,
                    html: `
                        <div style="text-align: left; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <p><strong>Credenciales generadas:</strong></p>
                            <p>📧 <strong>Correo:</strong> ${correo}</p>
                            <p>🔐 <strong>Contraseña generada:</strong> ${contrasena}</p>
                            <p style="color: #dc3545; margin-top: 10px;">⚠️ El usuario deberá cambiar esta contraseña después de iniciar sesión.</p>
                        </div>
                    `
                });
                document.getElementById('formRegistrarPersonal').reset();
                document.getElementById('especialidadGroup').style.display = 'none';
                document.getElementById('areaGroup').style.display = 'none';
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: resultado.mensaje });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Error', text: 'Error al registrar el personal: ' + error.message });
        }
    }

    function cambiarTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(`section-${tab}`).classList.add('active');
        if (tab === 'listar') cargarPersonal();
        else if (tab === 'estadisticas') cargarEstadisticas();
    }

    function volverDashboard() { window.location.href = '/dashboard-admin.html'; }
</script>

</body>
</html>
