<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exámenes de Pacientes - VITAL+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #0077b6;
      --secondary-color: #00b4d8;
      --accent-color: #90e0ef;
      --dark-color: #03045e;
      --light-color: #caf0f8;
      --success-color: #06d6a0;
      --warning-color: #ffd166;
      --danger-color: #ef476f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #ffffff); /* Fondo degradado suave */
      min-height: 100vh;
      padding: 0; /* ELIMINADO: Quita el espacio alrededor del cuerpo para que el header toque los bordes */
    }

    .container-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px; /* AGREGADO: Devuelve el padding al contenido principal */
    }

    /* 🏥 ESTILOS DEL HEADER VITAL+ (GLOBAL) */
    .global-header {
      background: linear-gradient(135deg, #0077b6, #00b4d8); /* Degradado azul */
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 119, 182, 0.3);
      position: relative;
      margin-bottom: 30px; /* Espacio debajo del header */
    }

    .logo-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-header img {
      width: 50px;
      height: 50px;
      /* Placeholder para logo */
    }

    .logo-header h1 {
      font-size: 1.8em;
      letter-spacing: 1px;
      color: white;
      margin: 0;
      font-weight: bold;
    }

    /* 🔍 Estilos del contenido principal (el antiguo header-section se usa ahora para el título) */
    .header-content {
      padding: 20px 0 10px 0;
    }

    .header-content h1 {
      color: var(--dark-color);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 2rem;
    }

    .header-content h1 i {
      color: var(--primary-color);
      font-size: 2rem;
    }

    .header-content p {
      color: #64748b;
      margin: 0;
    }

    /* Buscador */
    .search-section {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 119, 182, 0.1);
    }

    .search-box {
      display: flex;
      gap: 15px;
      align-items: flex-end;
    }

    .search-input-group {
      flex: 1;
    }

    .search-input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--dark-color);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .search-input-group input {
      width: 100%;
      padding: 12px 20px;
      border: 2px solid var(--light-color);
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .search-input-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(0, 119, 182, 0.1);
    }

    .btn-search {
      padding: 12px 30px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-search:hover {
      background: var(--dark-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
    }

    /* Información del Paciente */
    .patient-info {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      color: white;
      display: none;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .patient-info h3 {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .patient-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .detail-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .detail-item span {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Estadísticas */
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      display: none;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .stat-card.total {
      border-left: 5px solid var(--primary-color);
    }

    .stat-card.completados {
      border-left: 5px solid var(--success-color);
    }

    .stat-card.proceso {
      border-left: 5px solid var(--warning-color);
    }

    .stat-card.pendientes {
      border-left: 5px solid var(--danger-color);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--dark-color);
    }

    .stat-label {
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Filtros */
    .filters-section {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .filters-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .filter-group {
      flex: 1;
    }

    .filter-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--dark-color);
      font-weight: 600;
      font-size: 0.85rem;
    }

    .filter-group select,
    .filter-group input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid var(--light-color);
      border-radius: 10px;
      font-size: 0.9rem;
    }

    /* Lista de Exámenes */
    .examenes-container {
      display: none;
    }

    .examen-card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      border-left: 5px solid var(--primary-color);
    }

    .examen-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .examen-card.completado {
      border-left-color: var(--success-color);
    }

    .examen-card.en-analisis,
    .examen-card.muestra-tomada {
      border-left-color: var(--warning-color);
    }

    .examen-card.pendiente {
      border-left-color: var(--danger-color);
    }

    .examen-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f1f5f9;
    }

    .examen-title {
      flex: 1;
    }

    .examen-title h3 {
      color: var(--dark-color);
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .examen-subtitle {
      color: #64748b;
      font-size: 0.9rem;
    }

    .estado-badge {
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .estado-badge.completado {
      background: #d1fae5;
      color: #065f46;
    }

    .estado-badge.en_analisis,
    .estado-badge.muestra_tomada {
      background: #fef3c7;
      color: #92400e;
    }

    .estado-badge.pendiente {
      background: #fee2e2;
      color: #991b1b;
    }

    .examen-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .info-item {
      padding: 15px;
      background: #f8fafc;
      border-radius: 10px;
    }

    .info-item .label {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-item .value {
      font-size: 1rem;
      color: var(--dark-color);
      font-weight: 500;
    }

    .resultado-section {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .resultado-section h4 {
      color: var(--dark-color);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .resultado-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .resultado-badge.normal {
      background: #d1fae5;
      color: #065f46;
    }

    .resultado-badge.anormal {
      background: #fef3c7;
      color: #92400e;
    }

    .resultado-badge.critico {
      background: #fee2e2;
      color: #991b1b;
    }

    .resultado-contenido {
      background: white;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.8;
      color: #334155;
      white-space: pre-wrap;
    }

    .observaciones-section {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      border-left: 4px solid var(--primary-color);
    }

    .observaciones-section h5 {
      font-size: 0.9rem;
      color: var(--dark-color);
      margin-bottom: 10px;
    }

    .btn-descargar {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-descargar:hover {
      background: var(--dark-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
    }

    .timeline {
      margin-top: 20px;
      padding-left: 25px;
      border-left: 3px solid var(--light-color);
    }

    .timeline-item {
      position: relative;
      padding-bottom: 20px;
      padding-left: 30px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -28px;
      top: 5px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary-color);
      border: 3px solid white;
      box-shadow: 0 0 0 3px var(--light-color);
    }

    .timeline-item.completado::before {
      background: var(--success-color);
    }

    .timeline-fecha {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .timeline-descripcion {
      color: var(--dark-color);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .empty-state i {
      font-size: 4rem;
      color: var(--light-color);
      margin-bottom: 20px;
    }

    .empty-state h3 {
      color: var(--dark-color);
      margin-bottom: 10px;
    }

    .empty-state p {
      color: #64748b;
    }

    /* El botón "Volver al Panel" se mantiene fijo, pero ajustamos su posición */
    .btn-volver {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
    }

    .btn-volver:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
    }

    @media (max-width: 768px) {
      .global-header {
        padding: 15px 20px;
      }
      .search-box {
        flex-direction: column;
      }

      .patient-details {
        grid-template-columns: 1fr;
      }

      .examen-header {
        flex-direction: column;
        gap: 15px;
      }

      .examen-info {
        grid-template-columns: 1fr;
      }

      .filters-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
<header class="global-header">
  <div class="logo-header">
    <img src="/images/logoblanco.png" alt="Logo VITAL+">
    <h1>VITAL+</h1>
  </div>
</header>

<button class="btn-volver" onclick="window.location.href='/Vistas/dashboard-doctor.html'">
  <i class="bi bi-arrow-left"></i> Volver al Panel
</button>

<div class="container-main">
  <div class="header-content">
    <h1>
      <i class="bi bi-clipboard2-pulse"></i>
      Exámenes de Laboratorio
    </h1>
    <p>Consulta los exámenes médicos de tus pacientes</p>
  </div>

  <div class="search-section">
    <div class="search-box">
      <div class="search-input-group">
        <label for="documentoBusqueda">
          <i class="bi bi-search"></i> Documento del Paciente
        </label>
        <input
                type="text"
                id="documentoBusqueda"
                placeholder="Ingresa el número de documento..."
                autocomplete="off"
        >
      </div>
      <button class="btn-search" onclick="buscarPaciente()">
        <i class="bi bi-search"></i>
        Buscar
      </button>
    </div>
  </div>

  <div class="patient-info" id="patientInfo">
    <h3>
      <i class="bi bi-person-circle"></i>
      Información del Paciente
    </h3>
    <div class="patient-details">
      <div class="detail-item">
        <strong>Nombre Completo</strong>
        <span id="patientNombre">-</span>
      </div>
      <div class="detail-item">
        <strong>Documento</strong>
        <span id="patientDocumento">-</span>
      </div>
      <div class="detail-item">
        <strong>Correo Electrónico</strong>
        <span id="patientCorreo">-</span>
      </div>
      <div class="detail-item">
        <strong>Teléfono</strong>
        <span id="patientTelefono">-</span>
      </div>
    </div>
  </div>

  <div class="stats-section" id="statsSection">
    <div class="stat-card total">
      <div class="stat-number" id="statTotal">0</div>
      <div class="stat-label">Total Exámenes</div>
    </div>
    <div class="stat-card completados">
      <div class="stat-number" id="statCompletados">0</div>
      <div class="stat-label">Completados</div>
    </div>
    <div class="stat-card proceso">
      <div class="stat-number" id="statProceso">0</div>
      <div class="stat-label">En Proceso</div>
    </div>
    <div class="stat-card pendientes">
      <div class="stat-number" id="statPendientes">0</div>
      <div class="stat-label">Pendientes</div>
    </div>
  </div>

  <div class="filters-section" id="filtersSection">
    <div class="filters-row">
      <div class="filter-group">
        <label for="filtroEstado">
          <i class="bi bi-funnel"></i> Estado
        </label>
        <select id="filtroEstado">
          <option value="todos">Todos los estados</option>
          <option value="pendiente">Pendientes</option>
          <option value="muestra-tomada">Muestra Tomada</option>
          <option value="en-analisis">En Análisis</option>
          <option value="completado">Completados</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filtroBusqueda">
          <i class="bi bi-search"></i> Buscar examen
        </label>
        <input
                type="text"
                id="filtroBusqueda"
                placeholder="Nombre del examen..."
        >
      </div>
    </div>
  </div>

  <div class="examenes-container" id="examenesContainer">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  // ============================================
  // /vista-examenes-medico.js
  // ============================================

  let examenesLaboratorio = [];
  let examenesFiltrados = [];
  let pacienteActual = null;

  window.addEventListener('DOMContentLoaded', () => {
    verificarAutenticacion();
    configurarEventListeners();
  });

  function verificarAutenticacion() {
    const token = localStorage.getItem('token');
    const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');

    if (!token || (usuario.rol !== 'medico' && usuario.rol !== 'doctor')) {
      Swal.fire({
        icon: 'error',
        title: 'Acceso Denegado',
        text: 'Debes ser médico para acceder a esta página'
      }).then(() => {
        window.location.href = '/login.html';
      });
      return;
    }
  }

  function configurarEventListeners() {
    // Enter en el campo de búsqueda
    document.getElementById('documentoBusqueda').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        buscarPaciente();
      }
    });

    // Filtros en tiempo real
    document.getElementById('filtroEstado').addEventListener('change', aplicarFiltros);
    document.getElementById('filtroBusqueda').addEventListener('input', aplicarFiltros);
  }

  async function buscarPaciente() {
    const documento = document.getElementById('documentoBusqueda').value.trim();

    if (!documento) {
      Swal.fire({
        icon: 'warning',
        title: 'Campo vacío',
        text: 'Por favor ingresa el documento del paciente'
      });
      return;
    }

    const token = localStorage.getItem('token');

    try {
      Swal.fire({
        title: 'Buscando...',
        text: 'Consultando información del paciente',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      // Buscar paciente por documento
      const response = await fetch(`/api/medico/paciente-examenes/${documento}`, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.mensaje || 'No se pudo obtener la información');
      }

      const resultado = await response.json();

      if (resultado.exito && resultado.datos) {
        pacienteActual = resultado.datos.paciente;
        examenesLaboratorio = resultado.datos.examenes || [];

        Swal.close();

        // Mostrar información del paciente
        mostrarInformacionPaciente(pacienteActual);

        // Actualizar estadísticas
        actualizarEstadisticas();

        // Mostrar exámenes
        aplicarFiltros();

        // Mostrar secciones
        document.getElementById('patientInfo').style.display = 'block';
        document.getElementById('statsSection').style.display = 'grid';
        document.getElementById('filtersSection').style.display = 'block';
        document.getElementById('examenesContainer').style.display = 'block';

        if (examenesLaboratorio.length === 0) {
          Swal.fire({
            icon: 'info',
            title: 'Sin exámenes',
            text: 'Este paciente no tiene exámenes registrados'
          });
        }
      }

    } catch (error) {
      console.error('❌ Error al buscar paciente:', error);
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: error.message || 'No se pudo obtener la información del paciente'
      });
    }
  }

  function mostrarInformacionPaciente(paciente) {
    document.getElementById('patientNombre').textContent = paciente.nombre || '-';
    document.getElementById('patientDocumento').textContent = paciente.identificacion || '-';
    document.getElementById('patientCorreo').textContent = paciente.correo || '-';
    document.getElementById('patientTelefono').textContent = paciente.telefono || '-';
  }

  function actualizarEstadisticas() {
    const total = examenesLaboratorio.length;
    const completados = examenesLaboratorio.filter(ex => ex.estado === 'completado').length;
    const proceso = examenesLaboratorio.filter(ex =>
            ['en-analisis', 'muestra-tomada'].includes(ex.estado)
    ).length;
    const pendientes = examenesLaboratorio.filter(ex => ex.estado === 'pendiente').length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statCompletados').textContent = completados;
    document.getElementById('statProceso').textContent = proceso;
    document.getElementById('statPendientes').textContent = pendientes;
  }

  function aplicarFiltros() {
    const filtroEstado = document.getElementById('filtroEstado').value;
    const filtroBusqueda = document.getElementById('filtroBusqueda').value.toLowerCase();

    examenesFiltrados = examenesLaboratorio.filter(examen => {
      const cumpleEstado = filtroEstado === 'todos' || examen.estado === filtroEstado;
      const cumpleBusqueda = examen.descripcion.toLowerCase().includes(filtroBusqueda);
      return cumpleEstado && cumpleBusqueda;
    });

    renderizarExamenes();
  }

  function renderizarExamenes() {
    const container = document.getElementById('examenesContainer');

    if (examenesFiltrados.length === 0) {
      container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <h3>No se encontraron exámenes</h3>
                <p>No hay exámenes que coincidan con los filtros aplicados</p>
            </div>
        `;
      return;
    }

    // Ordenar: completados primero, luego por fecha
    const examenesOrdenados = [...examenesFiltrados].sort((a, b) => {
      if (a.estado === 'completado' && b.estado !== 'completado') return -1;
      if (a.estado !== 'completado' && b.estado === 'completado') return 1;
      return new Date(b.fechaSolicitud || 0) - new Date(a.fechaSolicitud || 0);
    });

    container.innerHTML = examenesOrdenados.map(examen => generarHTMLExamen(examen)).join('');
  }

  function generarHTMLExamen(examen) {
    const estadoClass = examen.estado.replace('-', '_');
    const estadoTexto = obtenerTextoEstado(examen.estado);

    return `
        <div class="examen-card ${examen.estado}">
            <!-- Header -->
            <div class="examen-header">
                <div class="examen-title">
                    <h3><i class="bi bi-clipboard2-pulse"></i> ${examen.descripcion}</h3>
                    <div class="examen-subtitle">
                        ${examen.codigoMuestra ? `<strong>Código:</strong> ${examen.codigoMuestra} • ` : ''}
                        <strong>Tipo:</strong> ${examen.tipo || 'Examen de laboratorio'}
                    </div>
                </div>
                <span class="estado-badge ${estadoClass}">
                    ${estadoTexto}
                </span>
            </div>

            <!-- Información General -->
            <div class="examen-info">
                ${examen.medico ? `
                <div class="info-item">
                    <div class="label"><i class="bi bi-person-badge"></i> Médico Solicitante</div>
                    <div class="value">${examen.medico.nombre}</div>
                    ${examen.medico.especialidad ? `<small style="color: #64748b;">${examen.medico.especialidad}</small>` : ''}
                </div>
                ` : ''}

                ${examen.fechaSolicitud ? `
                <div class="info-item">
                    <div class="label"><i class="bi bi-calendar-check"></i> Fecha de Solicitud</div>
                    <div class="value">${formatearFecha(examen.fechaSolicitud)}</div>
                </div>
                ` : ''}

                ${examen.prioridad ? `
                <div class="info-item">
                    <div class="label"><i class="bi bi-exclamation-circle"></i> Prioridad</div>
                    <div class="value">${examen.prioridad.toUpperCase()}</div>
                </div>
                ` : ''}

                ${examen.tecnico ? `
                <div class="info-item">
                    <div class="label"><i class="bi bi-person-check"></i> Técnico Responsable</div>
                    <div class="value">${examen.tecnico.nombre}</div>
                </div>
                ` : ''}
            </div>

            ${examen.justificacion ? `
            <div class="info-item" style="margin-bottom: 20px;">
                <div class="label"><i class="bi bi-chat-text"></i> Justificación Médica</div>
                <div class="value" style="white-space: pre-wrap;">${examen.justificacion}</div>
            </div>
            ` : ''}

            <!-- Timeline del Proceso -->
            <h5 style="margin-top: 20px; margin-bottom: 15px; color: var(--dark-color);">
                <i class="bi bi-clock-history"></i> Línea de Tiempo
            </h5>
            <div class="timeline">
                ${generarTimeline(examen)}
            </div>

            <!-- Resultados (si están disponibles) -->
            ${examen.estado === 'completado' && examen.resultado ? `
                <div class="resultado-section">
                    <h4><i class="bi bi-file-earmark-medical"></i> Resultados del Examen</h4>

                    ${examen.estadoResultado ? `
                        <span class="resultado-badge ${examen.estadoResultado}">
                            ${examen.estadoResultado === 'normal' ? '✅ NORMAL' :
            examen.estadoResultado === 'anormal' ? '⚠️ ANORMAL' :
                    '🚨 CRÍTICO'}
                        </span>
                    ` : ''}

                    <div class="resultado-contenido">
                        ${examen.resultado}
                    </div>

                    ${examen.observaciones ? `
                        <div class="observaciones-section">
                            <h5><i class="bi bi-chat-dots"></i> Observaciones Técnicas</h5>
                            <p style="margin: 0; white-space: pre-wrap;">${examen.observaciones}</p>
                        </div>
                    ` : ''}

                    <div style="margin-top: 15px; text-align: right;">
                        <button class="btn-descargar" onclick="descargarResultado('${examen.id}')">
                            <i class="bi bi-download"></i> Descargar Resultados
                        </button>
                    </div>
                </div>
            ` : ''}

            <!-- Información sobre la muestra -->
            ${examen.tipoMuestra ? `
                <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 10px;">
                    <h5 style="color: var(--dark-color); margin-bottom: 10px;">
                        <i class="bi bi-droplet-fill"></i> Información de la Muestra
                    </h5>
                    <div class="examen-info">
                        <div class="info-item">
                            <div class="label">Tipo de Muestra</div>
                            <div class="value">${examen.tipoMuestra}</div>
                        </div>
                        ${examen.condicionMuestra ? `
                        <div class="info-item">
                            <div class="label">Condición</div>
                            <div class="value">${examen.condicionMuestra}</div>
                        </div>
                        ` : ''}
                        ${examen.metodoAnalisis ? `
                        <div class="info-item">
                            <div class="label">Método de Análisis</div>
                            <div class="value">${examen.metodoAnalisis}</div>
                        </div>
                        ` : ''}
                    </div>
                </div>
            ` : ''}
        </div>
    `;
  }

  function generarTimeline(examen) {
    let timeline = '';

    if (examen.fechaSolicitud) {
      timeline += `
            <div class="timeline-item">
                <div class="timeline-fecha">${formatearFechaCompleta(examen.fechaSolicitud)}</div>
                <div class="timeline-descripcion">
                    <i class="bi bi-file-text"></i> Examen solicitado por ${examen.medico?.nombre || 'Médico'}
                </div>
            </div>
        `;
    }

    if (examen.fechaTomaMuestra) {
      timeline += `
            <div class="timeline-item">
                <div class="timeline-fecha">${formatearFechaCompleta(examen.fechaTomaMuestra)}</div>
                <div class="timeline-descripcion">
                    <i class="bi bi-droplet"></i> Muestra tomada y registrada
                </div>
            </div>
        `;
    }

    if (examen.fechaInicioAnalisis) {
      timeline += `
            <div class="timeline-item">
                <div class="timeline-fecha">${formatearFechaCompleta(examen.fechaInicioAnalisis)}</div>
                <div class="timeline-descripcion">
                    <i class="bi bi-microscope"></i> Análisis iniciado por ${examen.tecnico?.nombre || 'Técnico de laboratorio'}
                </div>
            </div>
        `;
    }

    if (examen.fechaRealizacion) {
      timeline += `
            <div class="timeline-item completado">
                <div class="timeline-fecha">${formatearFechaCompleta(examen.fechaRealizacion)}</div>
                <div class="timeline-descripcion">
                    <i class="bi bi-check-circle"></i> Examen completado y resultados disponibles
                </div>
            </div>
        `;
    }

    if (!timeline) {
      timeline = `
            <div class="timeline-item">
                <div class="timeline-fecha">Pendiente</div>
                <div class="timeline-descripcion">
                    <i class="bi bi-hourglass-split"></i> Esperando procesamiento
                </div>
            </div>
        `;
    }

    return timeline;
  }

  async function descargarResultado(idExamen) {
    const token = localStorage.getItem('token');

    try {
      Swal.fire({
        title: 'Generando PDF...',
        text: 'Por favor espera',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      const response = await fetch(`/api/medico/examenes/${idExamen}/descargar-pdf`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) {
        throw new Error('No se pudo generar el PDF');
      }

      // Obtener el blob del PDF
      const blob = await response.blob();

      // Obtener nombre del archivo del header
      const contentDisposition = response.headers.get('Content-Disposition');
      let filename = 'Resultado_Examen.pdf';

      if (contentDisposition) {
        const filenameMatch = contentDisposition.match(/filename="?(.+)"?/i);
        if (filenameMatch) {
          filename = filenameMatch[1];
        }
      }

      // Crear URL temporal y descargar
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();

      // Limpiar
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);

      Swal.fire({
        icon: 'success',
        title: '¡Descarga exitosa!',
        text: 'El resultado ha sido descargado en formato PDF',
        timer: 2000,
        showConfirmButton: false
      });

    } catch (error) {
      console.error('❌ Error al descargar PDF:', error);
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'No se pudo descargar el resultado: ' + error.message
      });
    }
  }

  function obtenerTextoEstado(estado) {
    const estados = {
      'pendiente': '⏳ Pendiente',
      'muestra-tomada': '💉 Muestra Tomada',
      'en-analisis': '🔬 En Análisis',
      'completado': '✅ Completado',
      'cancelado': '❌ Cancelado'
    };
    return estados[estado] || estado;
  }

  function formatearFecha(fecha) {
    if (!fecha) return 'N/A';
    const date = new Date(fecha);
    return date.toLocaleDateString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  function formatearFechaCompleta(fecha) {
    if (!fecha) return 'N/A';
    const date = new Date(fecha);
    return date.toLocaleString('es-ES', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
</script>
</body>
</html>
