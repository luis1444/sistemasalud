<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas Médicas | VITAL+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #66bb6a, #81c784, #a5d6a7);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 4px 15px rgba(102, 187, 106, 0.3);
            margin-bottom: 30px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title i {
            font-size: 2em;
        }

        .header-title h1 {
            font-size: 1.8em;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: white;
            color: #66bb6a;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Búsqueda */
        .search-section {
            background: linear-gradient(135deg, #ffffff, #f8fdf9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(102, 187, 106, 0.1);
            margin-bottom: 30px;
            border-left: 5px solid #81c784;
        }

        .search-form {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            color: #52796f;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #66bb6a;
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.1);
        }

        .btn-buscar {
            background: linear-gradient(135deg, #66bb6a, #81c784);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-buscar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 187, 106, 0.3);
        }

        /* Info Paciente */
        .paciente-info {
            background: linear-gradient(135deg, #ffffff, #f1f8f4);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(102, 187, 106, 0.1);
            margin-bottom: 30px;
            border-left: 5px solid #66bb6a;
            display: none;
        }

        .paciente-info.show {
            display: block;
        }

        .paciente-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .paciente-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #66bb6a, #81c784);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: 700;
        }

        .paciente-datos h3 {
            color: #66bb6a;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .paciente-datos p {
            color: #52796f;
            font-size: 0.95em;
        }

        .paciente-detalles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding-top: 20px;
            border-top: 2px solid #e8f5e9;
        }

        .detalle-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detalle-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #66bb6a;
        }

        .detalle-text {
            flex: 1;
        }

        .detalle-label {
            font-size: 0.8em;
            color: #52796f;
            margin-bottom: 2px;
        }

        .detalle-value {
            font-size: 0.95em;
            color: #2d3748;
            font-weight: 600;
        }

        /* Lista de Recetas */
        .recetas-section {
            display: none;
        }

        .recetas-section.show {
            display: block;
        }

        .recetas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .recetas-header h2 {
            color: #66bb6a;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recetas-count {
            background: linear-gradient(135deg, #66bb6a, #81c784);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .receta-card {
            background: linear-gradient(135deg, #ffffff, #f8fdf9);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(102, 187, 106, 0.1);
            margin-bottom: 20px;
            border-left: 5px solid #81c784;
            transition: all 0.3s ease;
        }

        .receta-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.2);
        }

        .receta-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .receta-titulo {
            flex: 1;
        }

        .receta-titulo h3 {
            color: #66bb6a;
            font-size: 1.3em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .medicamento-nombre {
            color: #2d3748;
            font-size: 1.1em;
            font-weight: 600;
        }

        .receta-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-aprobada {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .badge-pendiente {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .badge-rechazada {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .badge-alta {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .badge-media {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .badge-baja {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .receta-detalles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detalle-receta {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .detalle-receta-label {
            font-size: 0.85em;
            color: #52796f;
            margin-bottom: 5px;
        }

        .detalle-receta-value {
            font-size: 1em;
            color: #2d3748;
            font-weight: 600;
        }

        .receta-observaciones {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 3px solid #66bb6a;
        }

        .receta-observaciones-title {
            font-size: 0.9em;
            color: #52796f;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .receta-observaciones-text {
            color: #2d3748;
            line-height: 1.5;
        }

        /* Estados */
        .sin-resultados {
            text-align: center;
            padding: 60px 20px;
            color: #52796f;
        }

        .sin-resultados i {
            font-size: 4em;
            color: #c8e6c9;
            margin-bottom: 20px;
        }

        .sin-resultados h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #66bb6a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #66bb6a;
        }

        .loading i {
            font-size: 3em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .alert i {
            font-size: 1.3em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            .search-form {
                flex-direction: column;
            }

            .btn-buscar {
                width: 100%;
                justify-content: center;
            }

            .paciente-header {
                flex-direction: column;
                text-align: center;
            }

            .receta-header {
                flex-direction: column;
            }

            .receta-detalles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-content">
        <div class="header-title">
            <i class="fas fa-prescription-bottle-alt"></i>
            <h1>Recetas Médicas</h1>
        </div>
        <a href="/Vistas/dashboard-farmacia.html" class="btn-volver">
            <i class="fas fa-arrow-left"></i>
            Volver
        </a>
    </div>
</div>

<!-- Container -->
<div class="container">
    <!-- Búsqueda -->
    <div class="search-section">
        <form class="search-form" id="formBusqueda" onsubmit="buscarPaciente(event)">
            <div class="form-group">
                <label for="identificacion">
                    <i class="fas fa-id-card"></i>
                    Identificación del Paciente
                </label>
                <input
                        type="text"
                        id="identificacion"
                        placeholder="Ingrese la cédula o ID del paciente"
                        required
                >
            </div>
            <button type="submit" class="btn-buscar">
                <i class="fas fa-search"></i>
                Buscar Recetas
            </button>
        </form>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading hidden">
        <i class="fas fa-spinner"></i>
        <p>Buscando recetas...</p>
    </div>

    <!-- Info Paciente -->
    <div id="pacienteInfo" class="paciente-info">
        <div class="paciente-header">
            <div class="paciente-avatar" id="pacienteAvatar">P</div>
            <div class="paciente-datos">
                <h3 id="pacienteNombre">Nombre del Paciente</h3>
                <p id="pacienteId">ID: 000000</p>
            </div>
        </div>
        <div class="paciente-detalles">
            <div class="detalle-item">
                <div class="detalle-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="detalle-text">
                    <div class="detalle-label">Correo</div>
                    <div class="detalle-value" id="pacienteCorreo">-</div>
                </div>
            </div>
            <div class="detalle-item">
                <div class="detalle-icon">
                    <i class="fas fa-phone"></i>
                </div>
                <div class="detalle-text">
                    <div class="detalle-label">Teléfono</div>
                    <div class="detalle-value" id="pacienteTelefono">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lista de Recetas -->
    <div id="recetasSection" class="recetas-section">
        <div class="recetas-header">
            <h2>
                <i class="fas fa-pills"></i>
                Medicamentos Prescritos
            </h2>
            <span class="recetas-count" id="recetasCount">0 recetas</span>
        </div>
        <div id="listaRecetas"></div>
    </div>

    <!-- Sin Resultados -->
    <div id="sinResultados" class="sin-resultados hidden">
        <i class="fas fa-prescription-bottle"></i>
        <h3>No se encontraron recetas</h3>
        <p>No hay medicamentos prescritos para este paciente.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const API_URL = 'http://https://vital-nafd.onrender.com/api';
    let pacienteActual = null;
    let recetasActuales = [];

    // Buscar paciente y sus recetas
    async function buscarPaciente(event) {
        event.preventDefault();

        const identificacion = document.getElementById('identificacion').value.trim();

        if (!identificacion) {
            mostrarError('Por favor ingrese una identificación');
            return;
        }

        try {
            mostrarLoading(true);
            ocultarResultados();

            const token = localStorage.getItem('token');

            // Buscar paciente por identificación
            const responsePaciente = await fetch(`${API_URL}/usuarios/buscar-identificacion/${identificacion}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!responsePaciente.ok) {
                const errorData = await responsePaciente.json();
                throw new Error(errorData.mensaje || 'Paciente no encontrado');
            }

            const dataPaciente = await responsePaciente.json();
            console.log('📦 Respuesta del servidor:', dataPaciente);

            // La respuesta puede venir en dataPaciente.datos o directamente en dataPaciente
            pacienteActual = dataPaciente.datos || dataPaciente;

            console.log('👤 Paciente encontrado:', pacienteActual);

            if (!pacienteActual || !pacienteActual.id) {
                throw new Error('No se pudo obtener la información del paciente');
            }

            // Buscar autorizaciones de medicamentos del paciente
            const responseAutorizaciones = await fetch(`${API_URL}/autorizaciones/paciente/${pacienteActual.id}/medicamentos`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!responseAutorizaciones.ok) {
                const errorData = await responseAutorizaciones.json();
                throw new Error(errorData.mensaje || 'Error al cargar las recetas');
            }

            const dataAutorizaciones = await responseAutorizaciones.json();
            recetasActuales = dataAutorizaciones.datos || [];

            mostrarInfoPaciente();
            mostrarRecetas();

        } catch (error) {
            console.error('Error:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error.message,
                confirmButtonColor: '#66bb6a'
            });
        } finally {
            mostrarLoading(false);
        }
    }

    // Mostrar información del paciente
    function mostrarInfoPaciente() {
        const inicial = pacienteActual.nombre ? pacienteActual.nombre.charAt(0).toUpperCase() : 'P';

        document.getElementById('pacienteAvatar').textContent = inicial;
        document.getElementById('pacienteNombre').textContent = pacienteActual.nombre || 'N/A';
        document.getElementById('pacienteId').textContent = `IDENTIFICACION: ${pacienteActual.identificacion}`;
        document.getElementById('pacienteCorreo').textContent = pacienteActual.correo || 'N/A';
        document.getElementById('pacienteTelefono').textContent = pacienteActual.telefono || 'N/A';

        document.getElementById('pacienteInfo').classList.add('show');
    }

    // Mostrar recetas
    function mostrarRecetas() {
        const container = document.getElementById('listaRecetas');
        const section = document.getElementById('recetasSection');
        const sinResultados = document.getElementById('sinResultados');

        if (recetasActuales.length === 0) {
            section.classList.remove('show');
            sinResultados.classList.remove('hidden');
            return;
        }

        sinResultados.classList.add('hidden');
        section.classList.add('show');

        document.getElementById('recetasCount').textContent = `${recetasActuales.length} ${recetasActuales.length === 1 ? 'receta' : 'recetas'}`;

        container.innerHTML = recetasActuales.map(receta => `
            <div class="receta-card">
                <div class="receta-header">
                    <div class="receta-titulo">
                        <h3>
                            <i class="fas fa-pills"></i>
                            Receta Médica
                        </h3>
                        <div class="medicamento-nombre">${receta.descripcion}</div>
                        <div class="receta-meta">
                            <span class="badge badge-${receta.estado}">
                                <i class="fas fa-${getEstadoIcon(receta.estado)}"></i>
                                ${capitalizar(receta.estado)}
                            </span>
                            <span class="badge badge-${receta.prioridad}">
                                ${capitalizar(receta.prioridad)} Prioridad
                            </span>
                        </div>
                    </div>
                </div>

                <div class="receta-detalles">
                    <div class="detalle-receta">
                        <div class="detalle-receta-label">
                            <i class="fas fa-user-md"></i> Médico
                        </div>
                        <div class="detalle-receta-value">${receta.medico?.nombre || 'N/A'}</div>
                    </div>

                    ${receta.medico?.especialidad ? `
                        <div class="detalle-receta">
                            <div class="detalle-receta-label">
                                <i class="fas fa-stethoscope"></i> Especialidad
                            </div>
                            <div class="detalle-receta-value">${receta.medico.especialidad}</div>
                        </div>
                    ` : ''}

                    ${receta.cantidad ? `
                        <div class="detalle-receta">
                            <div class="detalle-receta-label">
                                <i class="fas fa-hashtag"></i> Cantidad
                            </div>
                            <div class="detalle-receta-value">${receta.cantidad}</div>
                        </div>
                    ` : ''}

                    ${receta.duracionTratamiento ? `
                        <div class="detalle-receta">
                            <div class="detalle-receta-label">
                                <i class="fas fa-calendar-check"></i> Duración
                            </div>
                            <div class="detalle-receta-value">${receta.duracionTratamiento}</div>
                        </div>
                    ` : ''}

                    <div class="detalle-receta">
                        <div class="detalle-receta-label">
                            <i class="fas fa-calendar"></i> Fecha de Solicitud
                        </div>
                        <div class="detalle-receta-value">${formatearFecha(receta.fechaSolicitud)}</div>
                    </div>

                    ${receta.fechaRespuesta ? `
                        <div class="detalle-receta">
                            <div class="detalle-receta-label">
                                <i class="fas fa-check-circle"></i> Fecha de Respuesta
                            </div>
                            <div class="detalle-receta-value">${formatearFecha(receta.fechaRespuesta)}</div>
                        </div>
                    ` : ''}
                </div>

                ${receta.justificacion ? `
                    <div class="receta-observaciones">
                        <div class="receta-observaciones-title">
                            <i class="fas fa-notes-medical"></i>
                            Justificación Médica
                        </div>
                        <div class="receta-observaciones-text">${receta.justificacion}</div>
                    </div>
                ` : ''}

                ${receta.observaciones ? `
                    <div class="receta-observaciones">
                        <div class="receta-observaciones-title">
                            <i class="fas fa-comment-medical"></i>
                            Observaciones de Autorización
                        </div>
                        <div class="receta-observaciones-text">${receta.observaciones}</div>
                    </div>
                ` : ''}
            </div>
        `).join('');
    }

    // Helpers
    function getEstadoIcon(estado) {
        const icons = {
            'aprobada': 'check-circle',
            'pendiente': 'clock',
            'rechazada': 'times-circle'
        };
        return icons[estado] || 'question-circle';
    }

    function capitalizar(texto) {
        return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function formatearFecha(fechaStr) {
        if (!fechaStr) return 'N/A';
        const fecha = new Date(fechaStr);
        return fecha.toLocaleDateString('es-ES', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function mostrarLoading(mostrar) {
        document.getElementById('loading').classList.toggle('hidden', !mostrar);
    }

    function ocultarResultados() {
        document.getElementById('pacienteInfo').classList.remove('show');
        document.getElementById('recetasSection').classList.remove('show');
        document.getElementById('sinResultados').classList.add('hidden');
    }

    // Verificar autenticación al cargar
    window.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');

        if (!token || usuario.rol !== 'farmacia') {
            Swal.fire({
                icon: 'error',
                title: 'Acceso denegado',
                text: 'No tienes permisos para acceder a esta página',
                confirmButtonColor: '#66bb6a'
            }).then(() => {
                window.location.href = '/login.html';
            });
        }
    });
</script>

</body>
</html>
